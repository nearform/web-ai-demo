<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="https://nearform.com/favicon.ico"
      type="image/x-icon"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="https://nearform.com/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="icon"
      href="https://nearform.com/favicon.svg"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="https://nearform.com/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Web AI Demo</title>
  </head>
  <body>
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm",
          "react": "https://cdn.jsdelivr.net/npm/react@19.2.8/+esm",
          "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@19.2.8/client/+esm"
        }
      }
    </script>
    <script type="module">
      import { createRoot } from "react-dom/client";
      import { html } from "./app/util/html.js";
      import { App } from "./app/index.js";

      const root = createRoot(document.getElementById("root"));
      root.render(html`<${App} />`);
    </script>
  </body>
</html>
