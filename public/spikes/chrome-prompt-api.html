<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="https://nearform.com/favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./spike.css" />
    <title>Chrome Prompt API — spike</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      This spike imports no runtime — Chrome's model is a built-in global — but it
      still needs the import map, because the shared harness imports crashbox.
    -->
    <script type="importmap">
      {
        "imports": {
          "crashbox": "https://cdn.jsdelivr.net/npm/crashbox@0.1.0/+esm"
        }
      }
    </script>
    <script type="module" src="./chrome-prompt-api.js"></script>
  </body>
</html>
